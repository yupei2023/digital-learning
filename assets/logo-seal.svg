.seal-band{font-family:Georgia,"Songti SC","Noto Serif CJK SC","STSong",serif;font-size:10.5px;letter-spacing:1.9px;fill:currentColor}
.seal-year{font-family:Georgia,"Songti SC","Noto Serif CJK SC","STSong",serif;font-size:12px;letter-spacing:3.2px;fill:currentColor}
</style>
