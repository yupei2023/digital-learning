<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="dl-seal-title dl-seal-desc">
<title id="dl-seal-title">Digital Learning 数字化学习 · 本课程的印记 The seal of this course</title>
<desc id="dl-seal-desc">深色圆形实地印记，课程标识以镂空方式刻在其上；外围一道细环。两台笔记本电脑相对扣放，屏幕在顶端相抵、留出一道窄缝，向下向外张开，机身沿下缘外展——合起来是一本摊开的书的轮廓。Two laptop computers set facing each other: their screens meet at the top, leaving a narrow gutter, and open downward and outward with the bodies splayed along the lower edge — together the silhouette of an open book. A solid dark disc with the course mark cut out of it, inside a thin outer ring.</desc>
