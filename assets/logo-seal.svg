<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="dl-seal-title dl-seal-desc">
<title id="dl-seal-title">Digital Learning 数字化学习 · 2026</title>
<desc id="dl-seal-desc">A light circular seal: the Digital Learning mark — an open spread that reads either as two facing pages or as two lit panels — inside a thin band carrying DIGITAL LEARNING · 数字化学习, with the year 2026 at the foot. 圆形印记：中间是课程标识——一个既可读作两页书、也可读作两块亮起面板的对开面；外圈细带书「DIGITAL LEARNING · 数字化学习」，底部年份 2026。</desc>
